<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mira Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-app ledger — blue header and balance card on white, bottom nav, one section per screen. Category colors code every expense. */
:root{
  --bg:#F4F7FC; --surface:#FFFFFF; --sunk:#EBF1FA; --ink:#0E1B33; --muted:#5B6B86; --line:#DCE4F1;
  --accent:#1F5FD6; --accent-ink:#FFFFFF; --accent-soft:#E2ECFD;
  --hero-bg:#1F5FD6; --hero-ink:#FFFFFF; --hero-soft:rgba(255,255,255,.72);
  --in:#16803C; --out:#C8372D; --warn:#B26B00; --move:#1F5FD6;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.05rem;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1080px;margin:0 auto;padding:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .peso{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:1.45rem}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.monthnav button:hover{background:var(--sunk);color:var(--ink)}
.monthnav span{min-width:128px;text-align:center;font-weight:600;font-size:.92rem}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.9rem;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.banner{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line);font-size:.88rem}
main{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:500;letter-spacing:-.03em;overflow-wrap:anywhere}
.kpi.main{background:var(--accent);color:var(--accent-ink)}
.kpi.main .label,.kpi.main .muted{color:inherit;opacity:.8}
.pos{color:var(--in)} .neg{color:var(--out)}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar .row{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.bar .row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:8px;background:var(--sunk);border-radius:4px;margin-top:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--accent)}
.fill.out{background:var(--out)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .title{font-weight:600;overflow-wrap:anywhere}
.li .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.paid{color:var(--in)} .pill.overdue{color:var(--out)} .pill.soon{color:var(--warn)} .pill.later{color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tag.business{background:var(--accent-soft);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.income{background:var(--in)} .dot.expense{background:var(--out)} .dot.bill{background:var(--warn)} .dot.transfer{background:var(--move)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.86rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--out)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:4px 9px;font-size:.78rem}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:13px 20px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22);font-size:.95rem}

.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:.9rem;text-align:center}

/* form */
.formcard{max-width:620px;margin:0 auto;width:100%}
.q{display:flex;flex-direction:column;gap:6px}
.q > label,.q > .qlabel{font-weight:600;font-size:.92rem}
.qs{display:flex;flex-direction:column;gap:16px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr));gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;cursor:pointer}
.choice span{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;height:100%}
.choice span b{font-size:.92rem}
.choice span small{color:var(--muted);font-size:.76rem}
.choice input:checked + span{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.choice input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.money{display:flex;align-items:stretch}
.money .cur{display:flex;align-items:center;padding:0 11px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;background:var(--sunk);font-family:var(--f-num);font-size:.9rem}
.money .inp{border-radius:0 8px 8px 0;font-family:var(--f-num)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.hint{font-size:.8rem;color:var(--muted)}
.filed{margin-top:4px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:.86rem}
.filed b{color:var(--accent)}

.edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;align-items:end;padding:12px;background:var(--sunk);border-radius:8px;margin-top:10px}
.edit .q label{font-size:.8rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:999px;font-size:.84rem;background:var(--surface)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);width:20px;height:20px;border-radius:50%}
.chip button:hover{background:var(--sunk);color:var(--out)}

svg text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:9;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{width:auto}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}

/* wizard */
.wiz{max-width:560px;margin:0 auto;width:100%;padding:20px}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.progbar{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progbar div{height:100%;background:var(--accent);border-radius:3px}
.qt{font-size:1.45rem;line-height:1.2;margin-bottom:6px}
.qt:focus{outline:none}
.step{min-height:180px;display:flex;flex-direction:column;gap:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-top:8px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:58px;width:100%}
.opt:hover{border-color:var(--accent)}
.opt b{font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.opt small{color:var(--muted);font-size:.8rem;font-family:var(--f-body)}
.opt .pill{margin-top:4px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.inp.big,.money.big .inp{font-size:1.25rem;padding:13px 14px}
.money.big .cur{font-size:1.05rem;padding:0 14px}
.wiznav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.wiznav .btn{padding:11px 18px;font-size:.95rem}
.review{display:flex;flex-direction:column;margin-top:6px}
.rv{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rvv{font-weight:600;min-width:0;overflow-wrap:anywhere}
.donecheck{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.6rem;font-weight:700;margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){.step{animation:stepin .22s ease-out}@keyframes stepin{from{opacity:.4;transform:translateX(14px)}to{opacity:1;transform:none}}}

.wks{display:flex;flex-direction:column}
.wk{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.wk:first-child{border-top:0}
.wk.now{background:var(--accent-soft);margin-inline:-16px;padding-inline:16px}
.wkhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.paychips{display:flex;flex-wrap:wrap;gap:6px}
.pay{font-size:.78rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pay.got{color:var(--in);border-color:currentColor}
.pay.late{color:var(--warn);border-color:currentColor}
.dot.save{background:var(--move)} .dot.borrow{background:#7C3AED}
.borrowc{color:#7C3AED} .dot.debt{background:var(--out)}

/* app shell */
.wrap{max-width:640px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
.topin{max-width:640px;padding:12px 16px}
.brand h1{font-size:1.15rem}.brand .peso{font-size:1.15rem}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;max-width:120px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer}
.bnav button[aria-current="page"]{color:var(--accent)}
.bnav .addbtn span{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:1.8rem;font-weight:400;line-height:1;margin-top:-22px;box-shadow:0 4px 14px rgba(0,0,0,.2);border:4px solid var(--bg)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ptitle{font-size:1.35rem}
.hero{padding:18px 4px 4px;display:flex;flex-direction:column;gap:2px}
.herov{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:2.2rem;font-weight:500;letter-spacing:-.04em;line-height:1.15;overflow-wrap:anywhere}
.acctlist summary{cursor:pointer;color:var(--accent);font-size:.86rem;font-weight:600;padding:4px 0;list-style:none}
.acctlist summary::after{content:" ▾"}
.acctlist[open] summary::after{content:" ▴"}
.acctlist .list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px;margin-top:6px}
.leftv{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:500;letter-spacing:-.03em;color:var(--in)}
.leftv.neg{color:var(--out)}
.trio,.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:14px}
.trio>div,.statrow>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.trio .num,.statrow .num{font-size:1rem;overflow-wrap:anywhere}
.statrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:0}
.warn{color:var(--warn)}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.86rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.chiprow button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.menu{padding:4px 0}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;font-size:1.1rem;color:var(--muted)}
.mrow:first-child{border-top:0}
.mrow b{display:block;color:var(--ink);font-size:.98rem}
.mrow small{display:block;color:var(--muted);font-size:.8rem}
.grid2{grid-template-columns:1fr}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.wiz{padding:18px}

/* blue & white skin */
header.top{background:var(--hero-bg);border-bottom:0;padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
header.top h1,header.top .peso{color:var(--hero-ink)}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:var(--r);padding:18px 18px 14px;margin-top:4px}
.hero .label{color:var(--hero-soft)}
.acctlist summary{color:var(--hero-ink)}
.acctlist .list{color:var(--ink)}
.card{border-radius:var(--r)}
.chiprow button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* category colors */
.cdot{width:12px;height:12px;border-radius:4px;flex:none;display:inline-block;background:var(--c)}
.ctag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 8px 2px 6px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);white-space:nowrap}
.ctag::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c)}
.li.cat{border-left:4px solid var(--c);padding-left:10px;margin-left:-2px}
.fill.c{background:var(--c)}
.opt.cat{border-left:5px solid var(--c)}
.opt.cat.sel{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.stack-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);margin-top:10px}
.stack-bar span{height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.swatch{width:22px;height:22px;border-radius:7px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.chip .swatch{width:18px;height:18px;border-radius:5px}
.palette{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--sunk);border-radius:10px;margin-top:8px}

.li.tap{cursor:pointer}
.li.tap:hover .title{color:var(--accent)}
.chev{color:var(--muted);font-size:1.2rem;padding-left:2px}
.sheetbg{position:fixed;inset:0;background:rgba(10,20,40,.38);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-width:640px;margin:0 auto;max-height:88vh;overflow-y:auto;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
body.noscroll{overflow:hidden}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sheetup .2s ease-out}@keyframes sheetup{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
.big3{margin-top:4px}.big3 .num{font-size:1.15rem;font-weight:500}
.debtmeta{font-size:.8rem;color:var(--muted);margin-top:6px;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.debtmeta b{color:var(--ink)}

.datebtn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;min-height:42px}
.datebtn svg{color:var(--accent);flex:none}
.datebtn.big{font-size:1.15rem;padding:13px 14px}
.pkbg{z-index:30}
.picker{position:fixed;z-index:31;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(360px,calc(100% - 24px));background:var(--surface);border-radius:16px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}

<script>
(function(){

const DEFAULT_CATS={business:["Software & subscriptions","Contractors & VAs","Ads & marketing","Equipment","Platform & bank fees","Internet & phone","Training","Taxes & registration","Other business"],personal:["Rent","Utilities","Loans","Groceries","Entertainment/Memberships","Gas","Toll","Meat","Fruits & Veggies","Furniture","Pets","Gifts/Holiday","Medical","Kalvin - Wants","Joei - Wants","Activities","Eat Out","Other"]};

  stepId:"kind",form:{kind:"",date:todayStr(),amount:"",accountId:"",streamId:"",scope:"",category:"",billId:"",billMonth:curMonth(),toAccountId:"",toAmount:"",note:""},
  lastFiled:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtCache={};
function money(a,cur="PHP"){cur=cur||"PHP";const f=fmtCache[cur]||(fmtCache[cur]=new Intl.NumberFormat("en-PH",{style:"currency",currency:cur,minimumFractionDigits:2,maximumFractionDigits:2}));return f.format(+a||0)}
function short(a){a=+a||0;const s=a<0?"-":"";a=Math.abs(a);if(a>=1e6)return s+"₱"+(a/1e6).toFixed(1)+"M";if(a>=1e3)return s+"₱"+(a/1e3).toFixed(a>=1e4?0:1)+"k";return s+"₱"+Math.round(a)}
function monthLabel(m,opt){const[y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString("en-PH",opt||{month:"long",year:"numeric"})}
function shiftMonth(m,d){const[y,mo]=m.split("-").map(Number);const t=new Date(y,mo-1+d,1);return t.getFullYear()+"-"+pad(t.getMonth()+1)}

/* ---------- category colors ---------- */
const PALETTE=["#E5484D","#F76B15","#E8A100","#46A758","#12A594","#0EA5E9","#3E63DD","#8E4EC6","#D6409F","#A1694B","#6B7A90","#84CC16","#C2410C","#0F766E","#BE185D","#7C3AED"];
const DEFAULT_COLORS={"Rent":"#8E4EC6","Utilities":"#E8A100","Loans":"#E5484D","Groceries":"#46A758","Entertainment/Memberships":"#D6409F","Car/Gas":"#F76B15","Gas":"#F76B15","Toll":"#A16207","Meat":"#B91C1C","Fruits & Veggies":"#65A30D","Furniture":"#7C3AED","Laundry":"#0EA5E9","Pets":"#A1694B","Gifts/Holiday":"#BE185D","Medical":"#12A594","Kalvin - Wants":"#3E63DD","Joei - Wants":"#0EA5E9","Activities":"#84CC16","Eat Out":"#C2410C","Other":"#6B7A90",
 "Software & subscriptions":"#3E63DD","Contractors & VAs":"#12A594","Ads & marketing":"#D6409F","Equipment":"#0F766E","Platform & bank fees":"#A1694B","Internet & phone":"#E8A100","Training":"#84CC16","Taxes & registration":"#E5484D","Other business":"#6B7A90"};
function catColor(name){const c=st()?.catColors?.[name]||DEFAULT_COLORS[name];if(c)return c;let h=0;for(const ch of String(name))h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
const entryCat=e=>e.kind==="debt"?"Loans":(e.category||"Other");
const ctag=n=>`<span class="ctag" style="--c:${catColor(n)}">${esc(n)}</span>`;
/* ---------- data helpers ---------- */
const st=()=>S.settings;
const accts=()=>(st()?.accounts||[]).filter(a=>!a.archived);
const streams=()=>(st()?.streams||[]).filter(s=>!s.archived);
const acct=id=>(st()?.accounts||[]).find(a=>a.id===id);
const stream=id=>(st()?.streams||[]).find(s=>s.id===id);
const bill=id=>(st()?.bills||[]).find(b=>b.id===id);
const abc=list=>[...list].sort((x,y)=>x.localeCompare(y,"en",{sensitivity:"base"}));
const cats=sc=>abc((st()?.categories?.[sc])||DEFAULT_CATS[sc]);
const rate=()=>+(st()?.usdRate)||0;
const toPHP=(a,c)=>c==="USD"?(+a||0)*rate():(+a||0);
const entRate=e=>e&&e.currency==="USD"?(+e.rate||rate()):1;
const entPHP=e=>e.currency==="USD"?(+e.amount||0)*entRate(e):(+e.amount||0);
const phpNote=e=>e.currency==="USD"&&entRate(e)?`<div class="small muted fxnote">≈ ${money(entPHP(e))}${e.rate?"":" (default rate)"}</div>`:"";
function balances(){const b={};(st()?.accounts||[]).forEach(a=>b[a.id]=+a.start||0);
  for(const e of S.entries){const a=+e.amount||0;
    if(e.kind==="income"||e.kind==="borrow"){if(e.accountId in b)b[e.accountId]+=a}
    else if(e.kind==="expense"||e.kind==="bill"||e.kind==="debt"){if(e.accountId in b)b[e.accountId]-=a}
    else if(e.kind==="transfer"){if(e.accountId in b)b[e.accountId]-=a;if(e.toAccountId in b)b[e.toAccountId]+=(e.toAmount!=null&&e.toAmount!==""?+e.toAmount:a)}}
  return b}
const inMonth=m=>S.entries.filter(e=>e.month===m);
const isSpend=e=>e.kind==="expense"||e.kind==="bill"||e.kind==="debt";
const borrowedOf=m=>inMonth(m).filter(e=>e.kind==="borrow").reduce((s,e)=>s+entPHP(e),0);
function incomeOf(m){return inMonth(m).filter(e=>e.kind==="income").reduce((s,e)=>s+entPHP(e),0)}
function spendOf(m,sc){return inMonth(m).filter(e=>isSpend(e)&&(sc==="combined"||e.scope===sc)).reduce((s,e)=>s+entPHP(e),0)}
/* schedules: monthly / twice a month / weekly, due on a date or on a day of the week */
const WDN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const ord=n=>n+(n%100>=11&&n%100<=13?"th":({1:"st",2:"nd",3:"rd"})[n%10]||"th");
const nthLabel=n=>+n===5?"last":ord(+n);
const freqOf=b=>b?.freq||(+b?.secondDay?"twice":"monthly");
const legacyTotal=b=>!b.freq&&+b.secondDay;
const perPay=b=>legacyTotal(b)?(+b.amount||0)/2:(+b.amount||0);
const perMonth=b=>({weekly:52/12,twice:2,monthly:1})[freqOf(b)];
const monthlyAmt=b=>perPay(b)*perMonth(b);
function nthWeekday(m,wd,n){const n2=daysIn(m);let d=1+((wd-dparse(m+"-01").getDay()+7)%7);if(+n===5){while(d+7<=n2)d+=7;return d}d+=(n-1)*7;return d<=n2?d:null}
function occDays(b,m){if(!b)return[1];const f=freqOf(b),by=b.by||"date",n=daysIn(m),wd=+b.weekday||0;
  if(f==="weekly"){const out=[];for(let d=1+((wd-dparse(m+"-01").getDay()+7)%7);d<=n;d+=7)out.push(d);return out}
  if(by==="weekday")return(f==="twice"?(b.nths||[1,3]):[+b.nth||1]).map(x=>nthWeekday(m,wd,x)).filter(Boolean);
  return(f==="twice"?[+b.dueDay||1,+b.secondDay||15]:[+b.dueDay||1]).map(d=>Math.min(d,n)).sort((a,c)=>a-c)}
const slotsOf=(b,m)=>occDays(b,m||UI.month).map((_,i)=>i+1);
const slotDay=(b,slot,m)=>occDays(b,m||UI.month)[slot-1]||1;
const slotAmt=b=>Math.round(perPay(b)*100)/100;
const slotName=(b,slot,m)=>slotsOf(b,m).length>1?ord(slotDay(b,slot,m))+" payment":"";
function dueDaysText(b){const f=freqOf(b),wd=WDN[+b.weekday||0];
  if(f==="weekly")return"every "+wd;
  if((b.by||"date")==="weekday")return(f==="twice"?(b.nths||[1,3]).map(nthLabel).join(" & "):nthLabel(b.nth||1))+" "+wd;
  return f==="twice"?ord(+b.dueDay||1)+" & "+ord(+b.secondDay||15):ord(+b.dueDay||1)}
const freqText=b=>({weekly:"weekly",twice:"twice a month",monthly:"monthly"})[freqOf(b)];
function schedFields(id,o,allowAny){const f=allowAny&&o.freq==="anytime"?"anytime":freqOf(o),by=f==="weekly"?"weekday":(o.by||"date");const nths=(o.nths||[1,3]).join(",");
  return `<div class="sched" data-freq="${f}" data-by="${by}">
   <div class="q"><label for="${id}-freq">How often</label><select class="inp" id="${id}-freq" name="freq">${opts([...(allowAny?[["anytime","Anytime in the month"]]:[]),["monthly","Once a month"],["twice","Twice a month"],["weekly","Weekly"]],f)}</select></div>
   <div class="q s-by"><span class="qlabel small">Due on</span><div class="seg" role="radiogroup"><label class="segopt"><input type="radio" name="by" value="date" ${by==="date"?"checked":""}><span>A date</span></label><label class="segopt"><input type="radio" name="by" value="weekday" ${by==="weekday"?"checked":""}><span>A day of the week</span></label></div></div>
   <div class="q s-date"><label for="${id}-d1">Day of the month</label><input class="inp" id="${id}-d1" name="dueDay" type="number" min="1" max="31" value="${esc(o.dueDay||15)}"></div>
   <div class="q s-date s-twice"><label for="${id}-d2">Second day</label><input class="inp" id="${id}-d2" name="secondDay" type="number" min="1" max="31" value="${esc(+o.secondDay||30)}"></div>
   <div class="q s-nth s-monthly"><label for="${id}-nth">Which one</label><select class="inp" id="${id}-nth" name="nth">${opts([["1","1st"],["2","2nd"],["3","3rd"],["4","4th"],["5","Last"]],String(o.nth||1))}</select></div>
   <div class="q s-nth s-twice"><label for="${id}-nths">Which ones</label><select class="inp" id="${id}-nths" name="nths">${opts([["1,3","1st & 3rd"],["2,4","2nd & 4th"]],nths)}</select></div>
   <div class="q s-wd"><label for="${id}-wd">Day of the week</label><select class="inp" id="${id}-wd" name="weekday">${opts(WDN.map((w,i)=>[String(i),w]),String(o.weekday??5))}</select></div>
  </div>`}
function parseSched(fd){const freq=["monthly","twice","weekly"].includes(fd.freq)?fd.freq:"monthly";const by=freq==="weekly"?"weekday":(fd.by==="weekday"?"weekday":"date");
  const cl=v=>Math.min(31,Math.max(1,parseInt(v)||1));
  return{freq,by,dueDay:cl(fd.dueDay),secondDay:freq==="twice"&&by==="date"?cl(fd.secondDay||30):0,weekday:Math.min(6,Math.max(0,parseInt(fd.weekday)||0)),nth:Math.min(5,Math.max(1,parseInt(fd.nth)||1)),nths:String(fd.nths||"1,3").split(",").map(Number)}}
function billStatus(b,m,slot=1){
  const paid=S.entries.find(e=>e.kind==="bill"&&e.billId===b.id&&e.billMonth===m&&(+e.billSlot||1)===slot);
  const day=Math.min(slotDay(b,slot,m)||1,daysIn(m));const due=m+"-"+pad(day);const base={due,slot,amt:slotAmt(b)};
  if(paid)return{...base,s:"paid",label:"Paid",paid};
  if((b.since&&due<b.since)||(TF()&&due<TF()))return{...base,s:"na",label:""};
  if(st()?.skips?.[b.id+"|"+m+"|"+slot])return{...base,s:"skipped",label:"Removed",skipped:true};

function trendCard(){const ms=[];for(let i=5;i>=0;i--)ms.push(shiftMonth(UI.month,-i));

function reviewBody(){const f=UI.form;const a=acct(f.accountId);const rows=[];

  if(f.kind==="bill"){rows.push(["Bill",bill(f.billId)?.name,"bill"]);rows.push(["Covers",monthLabel(f.billMonth),"billMonth"]);if(slotsOf(bill(f.billId),f.billMonth).length>1)rows.push(["Payment",slotName(bill(f.billId),+f.billSlot||1,f.billMonth),"billSlot"])}

function filedPath(){const f=UI.form;const a=acct(f.accountId),t=acct(f.toAccountId);

async function submitEntry(){const f=UI.form;const amt=parseFloat(f.amount);
  if(f.kind==="save"){const g=(st().goals||[]).find(x=>x.id===f.goalId);if(!g)return toast("Choose a goal.");if(!(amt>0))return toast("Enter an amount above zero.");
    const e={id:uid(),kind:"save",goalId:g.id,date:f.date,month:f.date.slice(0,7),amount:Math.round(amt*100)/100,currency:"PHP",note:f.note.trim(),createdAt:new Date().toISOString()};const where=filedPath();
    try{await putEntry(e);UI.lastFiled=where;UI.stepId="done";render()}catch(err){toast(errMsg(err))}return}
  const a=acct(f.accountId);
  if(!a){UI.stepId="account";render();return toast("Choose an account.")}if(!(amt>0)){UI.stepId="amount";render();return toast("Enter an amount above zero.")}
  const e={id:uid(),date:f.date,month:f.date.slice(0,7),amount:Math.round(amt*100)/100,currency:a.currency,accountId:a.id,note:f.note.trim(),createdAt:new Date().toISOString()};
  if(a.currency==="USD"&&parseFloat(f.rate)>0)e.rate=parseFloat(f.rate);
  if(f.kind==="in"){const s=stream(f.streamId);if(!s)return toast("Choose a client.");Object.assign(e,{kind:"income",streamId:s.id,scope:"business"})}
  else if(f.kind==="out"){if(!f.category)return toast("Choose a category.");Object.assign(e,{kind:"expense",scope:f.scope,category:f.category});if(f.category==="Loans"&&debtById(f.debtId))e.debtId=f.debtId;if(budgetById(f.budgetId)?.category===f.category)e.budgetId=f.budgetId;if(f.oneTimeId)e.oneTimeId=f.oneTimeId}
  else if(f.kind==="borrow"){let did=f.debtId;
    if(did==="new"){const nm=(f.debtName||"").trim();if(!nm)return toast("Give the debt a name.");did=uid();S.settings.debts=[...(S.settings.debts||[]),{id:did,name:nm,original:Math.round(amt*100)/100,opening:0,monthly:0,startDate:f.date}];saveSettings()}
    else if(!debtById(did))return toast("Choose a debt.");
    Object.assign(e,{kind:"borrow",debtId:did})}
  else if(f.kind==="debt"){const d=(st().debts||[]).find(x=>x.id===f.debtId);if(!d)return toast("Choose a debt.");Object.assign(e,{kind:"debt",debtId:d.id,scope:"personal",category:"Loans"})}
  else if(f.kind==="bill"){const b=bill(f.billId);if(!b)return toast("Choose a bill.");Object.assign(e,{kind:"bill",billId:b.id,billMonth:f.billMonth,billSlot:slotsOf(b,f.billMonth).length>1?(+f.billSlot||1):1,scope:b.scope||"personal",category:b.category||"Utilities"})}
  else{const t=acct(f.toAccountId);if(!t||t.id===a.id)return toast("Choose two different accounts.");const ta=isFx(f)?parseFloat(f.toAmount):amt;Object.assign(e,{kind:"transfer",toAccountId:t.id,toAmount:Math.round(ta*100)/100,toCurrency:t.currency})}
  const where=filedPath();
  try{await putEntry(e);UI.lastFiled=where;UI.stepId="done";render();window.scrollTo(0,0)}catch(err){toast(errMsg(err))}}

/* ---------- weeks, paydays, plan, debts, goals ---------- */
const dstr=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dparse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function weeksOf(m){const n=daysIn(m);const out=[];let a=1;for(let d=1;d<=n;d++){const dow=dparse(m+"-"+pad(d)).getDay();if(dow===0||d===n){out.push([m+"-"+pad(a),m+"-"+pad(d)]);a=d+1}}return out}
function paydays(s,m){if(!(+s.expected)||!s.freq||s.freq==="none"||s.archived)return[];const a=s.anchor||m+"-01";const ms=m+"-01",me=m+"-"+pad(daysIn(m));if(a>me)return[];
  if(s.freq==="monthly"){const d=Math.min(dparse(a).getDate(),daysIn(m));const x=m+"-"+pad(d);return x>=a?[x]:[]}
  const step=s.freq==="biweekly"?14:7;const t=dparse(a);while(dstr(t)<ms)t.setDate(t.getDate()+step);const out=[];while(dstr(t)<=me){out.push(dstr(t));t.setDate(t.getDate()+step)}return out}
const TF=()=>st()?.trackFrom||"";
function allPaydays(m){const out=[];for(const s of st().streams||[])for(const d of paydays(s,m))if(d>=TF())out.push({date:d,s,raw:+s.expected,cur:s.currency||"PHP",amt:toPHP(+s.expected,s.currency||"PHP")});return out.sort((a,b)=>a.date.localeCompare(b.date))}
function gotPaid(p){const t=dparse(p.date);return S.entries.find(e=>e.kind==="income"&&e.streamId===p.s.id&&Math.abs((dparse(e.date)-t)/864e5)<=3)}
const expectedOf=m=>allPaydays(m).reduce((s,p)=>s+p.amt,0);
function rng(a,b){const f=x=>dparse(x).toLocaleDateString("en-PH",{month:"short",day:"numeric"});return a===b?f(a):f(a)+"–"+dparse(b).getDate()}
function weeksCard(){const m=UI.month;const pds=allPaydays(m);const t=todayStr();
  const rows=weeksOf(m).map(([a,b],i)=>{const inc=S.entries.filter(e=>e.kind==="income"&&e.date>=a&&e.date<=b).reduce((s,e)=>s+entPHP(e),0);
    const out=S.entries.filter(e=>isSpend(e)&&e.date>=a&&e.date<=b).reduce((s,e)=>s+entPHP(e),0);
    const p=pds.filter(x=>x.date>=a&&x.date<=b);const exp=p.reduce((s,x)=>s+x.amt,0);const now=t>=a&&t<=b;
    return `<div class="wk${now?" now":""}"><div class="wkhead"><span><b>Week ${i+1}</b> <span class="muted small">${rng(a,b)}</span>${now?' <span class="tag business">This week</span>':""}</span><span class="num small"><span class="pos">+${money(inc)}</span> · <span class="neg">−${money(out)}</span></span></div>
    ${p.length?`<div class="paychips">${p.map(x=>{const g=gotPaid(x);return `<span class="pay ${g?"got":x.date<t?"late":""}">${g?"✓":x.date<t?"!":"○"} ${dparse(x.date).toLocaleDateString("en-PH",{weekday:"short",day:"numeric"})} · ${esc(x.s.name.split(/[–—-]/)[0].trim())} <span class="num">${(g?money(g.amount,g.currency):money(x.raw,x.cur))}</span></span>`}).join("")}</div>`:""}

function planBase(m){const r=incomeOf(m);return r>0?{base:r,note:"of income received"}:{base:expectedOf(m),note:"of expected income (nothing logged yet)"}}
function planCard(){const m=UI.month;const pl=st().plan||{spendPct:70};const {base,note}=planBase(m);const budget=base*(+pl.spendPct||0)/100;const spent=spendOf(m,"combined");const pct=budget?Math.min(100,spent/budget*100):0;

  for(const g of gl){const want=base*(+g.pct||0)/100;const got=S.entries.filter(e=>e.kind==="save"&&e.goalId===g.id&&e.month===m).reduce((s,e)=>s+(+e.amount||0),0);

const entryDebt=e=>e.debtId||(e.kind==="bill"?bill(e.billId)?.debtId:"")||"";

function debtMonthly(d){const bl=debtBill(d.id);if(bl)return monthlyAmt(bl);if(+d.payAmt&&d.freq)return +d.payAmt*perMonth(d);return +d.monthly||0}
function debtPerPay(d){const bl=debtBill(d.id);return bl?perPay(bl):(+d.payAmt||+d.monthly||0)}
function nextDueOf(d){if(debtLeft(d)<=0)return null;const bl=debtBill(d.id);const t=todayStr();
  if(bl){for(let i=0;i<=3;i++){const mm=shiftMonth(curMonth(),i);if(!activeIn(bl,mm))continue;for(const sl of slotsOf(bl,mm)){const st2=billStatus(bl,mm,sl);if(!isDone(st2))return{date:st2.due,late:st2.due<t}}}return null}
  if(!d.nextDue)return null;let v=d.nextDue;const day=dparse(d.nextDue).getDate();
  const lastPay=debtPays(d.id).map(e=>e.date).sort().pop()||"";
  while(v<t&&lastPay>=v){const m=shiftMonth(v.slice(0,7),1);v=m+"-"+pad(Math.min(day,daysIn(m)))}
  return{date:v,late:v<t}}
function debtPlan(d){const left=debtLeft(d),mo=debtMonthly(d);if(left<=0)return{months:0};if(!mo)return{months:null};
  const months=Math.ceil(left/mo-1e-9);const nd=nextDueOf(d);
  if(nd)return{months,mo,finish:shiftMonth(nd.date.slice(0,7),months-1)};
  const paidNow=debtPays(d.id).some(e=>e.month===curMonth());
  return{months,mo,finish:shiftMonth(curMonth(),paidNow?months:months-1)}}
const debtLeft=d=>Math.max(0,(+d.opening||0)+debtBorrowed(d.id)-debtPaid(d.id));
const debtTotal=d=>Math.max(+d.original||0,(+d.opening||0)+debtBorrowed(d.id));

  if(el.name==="freq"){sc.dataset.freq=el.value;if(el.value==="weekly")sc.dataset.by="weekday";else{const r=sc.querySelector('input[name="by"]:checked');sc.dataset.by=r?r.value:"date"}}
  if(el.name==="by")sc.dataset.by=el.value});
document.addEventListener("input",ev=>{const el=ev.target;
  if(el.id==="q"){UI.q=el.value;clearTimeout(window.__qt);window.__qt=setTimeout(()=>{const r=$("#sres");if(r)r.innerHTML=searchResults(UI.q)},120);return}if(el.dataset&&el.dataset.f&&!("rr" in el.dataset))UI.form[el.dataset.f]=el.value;
  if(el.id==="w-amt"||el.id==="w-rate"){const o=document.getElementById("fxval");if(o)o.textContent=fxText()}
  if(el.id==="ee-amt"||el.id==="ee-rate"){const o=document.getElementById("eefx");if(o){const a=parseFloat($("#ee-amt")?.value),r=parseFloat($("#ee-rate")?.value);o.textContent=a>0&&r>0?money(a*r):"—"}}});
document.addEventListener("change",ev=>{const el=ev.target;
  if(el.dataset&&el.dataset.f){UI.form[el.dataset.f]=el.value;if(el.dataset.f==="kind")UI.lastFiled=null;if("bill" in el.dataset)prefillBill();if("rr" in el.dataset)render();return}
  if(el.id==="actKind"){UI.actKind=el.value;render()}if(el.id==="actScope"){UI.actScope=el.value;render()}});
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target;const fd=Object.fromEntries(new FormData(f));
  if(f.id==="wiz"){wizNext();return}
  if(f.id==="entryEdit"){saveEntryEdit(fd);return}
  const s=S.settings;
  if(f.dataset.billform){const id=f.dataset.billform;if(!fd.name.trim())return toast("Give the bill a name.");
    const b={id:id==="new"?uid():id,name:fd.name.trim(),amount:parseFloat(fd.amount)||0,...parseSched(fd),accountId:fd.accountId||"",scope:fd.scope,category:fd.debtId?"Loans":fd.category,variable:!!fd.variable,debtId:fd.debtId||""};
    s.bills=s.bills||[];const ob=s.bills.find(x=>x.id===id);if(ob?.startMonth)b.startMonth=ob.startMonth;if(ob?.since)b.since=ob.since;if(id==="new")b.since=todayStr();id==="new"?s.bills.push(b):s.bills=s.bills.map(x=>x.id===id?b:x);UI.editing=null;saveSettings();toast("Bill saved");return}
  if(f.dataset.acctform){const id=f.dataset.acctform;if(!fd.name.trim())return toast("Give the account a name.");
    const a={id:id==="new"?uid():id,name:fd.name.trim(),type:fd.type,currency:fd.currency,start:parseFloat(fd.start)||0,archived:!!fd.archived};
    s.accounts=s.accounts||[];id==="new"?s.accounts.push(a):s.accounts=s.accounts.map(x=>x.id===id?a:x);UI.editing=null;saveSettings();toast("Account saved");return}
  if(f.dataset.streamform){const id=f.dataset.streamform;if(!fd.name.trim())return toast("Give the stream a name.");
    const x={id:id==="new"?uid():id,name:fd.name.trim(),via:fd.via.trim(),accountId:fd.accountId||"",archived:!!fd.archived,expected:parseFloat(fd.expected)||0,currency:fd.currency||"PHP",freq:fd.freq,anchor:fd.anchor||""};
    s.streams=s.streams||[];id==="new"?s.streams.push(x):s.streams=s.streams.map(y=>y.id===id?x:y);UI.editing=null;saveSettings();toast("Stream saved");return}
  if(f.dataset.debtform){const id=f.dataset.debtform;if(!fd.name.trim())return toast("Give the debt a name.");const o=parseFloat(fd.original)||0;
    const sc=parseSched(fd);const pay=parseFloat(fd.payAmt)||0;
    const x={id:id==="new"?uid():id,name:fd.name.trim(),original:o,opening:fd.opening===""?o:(parseFloat(fd.opening)||0),payAmt:pay,...sc,monthly:pay*({weekly:52/12,twice:2,monthly:1})[sc.freq],startDate:fd.startDate||"",nextDue:fd.nextDue||""};
    s.debts=s.debts||[];id==="new"?s.debts.push(x):s.debts=s.debts.map(y=>y.id===id?x:y);
    s.bills=s.bills||[];const lb=s.bills.find(b=>b.debtId===x.id);
    if(lb){Object.assign(lb,sc);if(pay&&!lb.variable)lb.amount=pay;if(x.nextDue&&!S.entries.some(e=>e.kind==="bill"&&e.billId===lb.id))lb.startMonth=x.nextDue.slice(0,7)}
    const made=!lb&&fd.addBill&&pay;
    if(made)s.bills.push({id:uid(),name:x.name,amount:pay,...sc,startMonth:x.nextDue?x.nextDue.slice(0,7):"",since:x.nextDue||todayStr(),accountId:fd.accountId||"",scope:"personal",category:"Loans",variable:false,debtId:x.id});
    UI.editing=null;saveSettings();toast(made?"Debt saved and added to Expenses":"Debt saved");return}
  if(f.dataset.otform){const id=f.dataset.otform;if(!fd.name.trim())return toast("Say what the expense is.");if(!fd.date)return toast("Pick when it's due.");
    const x={id:id==="new"?uid():id,name:fd.name.trim(),amount:parseFloat(fd.amount)||0,date:fd.date,category:fd.category||"Other",accountId:fd.accountId||"",note:(fd.note||"").trim()};
    s.oneTime=s.oneTime||[];id==="new"?s.oneTime.push(x):s.oneTime=s.oneTime.map(y=>y.id===id?x:y);UI.editing=null;
    if(x.date.slice(0,7)!==UI.month)UI.month=x.date.slice(0,7);saveSettings();toast("Saved for "+monthLabel(x.date.slice(0,7)));return}
  if(f.dataset.budgetform){const id=f.dataset.budgetform;if(!fd.category)return toast("Choose a category.");
    const sc=fd.freq==="anytime"?{freq:"anytime"}:parseSched(fd);const x={id:id==="new"?uid():id,name:(fd.name||"").trim(),category:fd.category,amount:parseFloat(fd.amount)||0,note:(fd.note||"").trim(),...sc};s.budgets=s.budgets||[];id==="new"?s.budgets.push(x):s.budgets=s.budgets.map(y=>y.id===id?x:y);UI.editing=null;saveSettings();toast("Budget saved");return}
  if(f.dataset.goalform){const id=f.dataset.goalform;if(!fd.name.trim())return toast("Give the goal a name.");
    const x={id:id==="new"?uid():id,name:fd.name.trim(),pct:parseFloat(fd.pct)||0,target:parseFloat(fd.target)||0};s.goals=s.goals||[];id==="new"?s.goals.push(x):s.goals=s.goals.map(y=>y.id===id?x:y);UI.editing=null;saveSettings();toast("Goal saved");return}
  if("planform" in f.dataset){s.plan={...(s.plan||{}),spendPct:Math.min(100,Math.max(0,parseFloat(fd.spendPct)||0))};saveSettings();toast("Plan saved");return}
  if("rateform" in f.dataset){s.usdRate=parseFloat(fd.usdRate)||"";saveSettings();toast("Rate saved");return}
  if(f.dataset.catform){const sc=f.dataset.catform;const c=(fd.cat||"").trim();if(!c)return;s.categories=s.categories||JSON.parse(JSON.stringify(DEFAULT_CATS));if(!cats(sc).includes(c))s.categories[sc]=[...cats(sc),c];saveSettings();return}
});


/* ---------- boot ---------- */
render();
/* ---------- on-device storage (this phone only) ---------- */
const LS_KEY="mira-ledger-data-v1";
function makeLocalDB(){let data=null;try{data=JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){}
  data=data&&typeof data==="object"?data:{settings:null,entries:{}};data.entries=data.entries||{};
  const subs={settings:new Set(),entries:new Set()};
  const persist=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(data));return true}catch(e){toast("Couldn't save. Your phone's storage may be full.");return false}};
  const snapDoc=()=>({exists:!!data.settings,data:()=>data.settings?JSON.parse(JSON.stringify(data.settings)):undefined});
  const snapCol=()=>({docs:Object.values(data.entries).map(e=>({id:e.id,data:()=>({...e})}))});
  const emit=k=>setTimeout(()=>subs[k].forEach(f=>f(k==="settings"?snapDoc():snapCol())),0);
  const putE=async(id,v)=>{data.entries[id]={...JSON.parse(JSON.stringify(v)),id};persist();emit("entries")};
  return{
    doc(path){if(path==="app/settings")return{set:async v=>{data.settings=JSON.parse(JSON.stringify(v));persist();emit("settings")},onSnapshot:f=>{subs.settings.add(f);setTimeout(()=>f(snapDoc()),0);return()=>subs.settings.delete(f)}};
      const id=path.split("/")[1];return{set:v=>putE(id,v),delete:async()=>{delete data.entries[id];persist();emit("entries")}}},
    collection(){return{doc:id=>({set:v=>putE(id,v)}),onSnapshot:f=>{subs.entries.add(f);setTimeout(()=>f(snapCol()),0);return()=>subs.entries.delete(f)}}},
    exportAll:()=>({app:"Mira Ledger",format:1,exportedAt:new Date().toISOString(),settings:data.settings,entries:Object.values(data.entries)}),
    importAll(obj){const ents=Array.isArray(obj.entries)?obj.entries:Object.values(obj.entries||{});data={settings:obj.settings||null,entries:{}};for(const e of ents)if(e&&e.id)data.entries[e.id]=e;const ok=persist();emit("settings");emit("entries");return ok}}}
async function boot(){
  db=makeLocalDB();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  db.doc("app/settings").onSnapshot(snap=>{S.settings=snap.exists?JSON.parse(JSON.stringify(snap.data())):null;S.sLoaded=true;render()},err=>{S.sLoaded=true;render();toast("Couldn't load your setup. Reload the page.")});
  db.collection("entries").onSnapshot(q=>{S.entries=q.docs.map(d=>({...d.data(),id:d.id}));S.eLoaded=true;if(UI.tab==="search"){const r=$("#sres");if(r&&!UI.editEntry)r.innerHTML=searchResults(UI.q||"");}else if(UI.tab!=="add"&&!UI.editEntry)render()},err=>toast("Couldn't load entries. Reload the page."));
}
boot();
})();
